<script>
  // Apply saved theme before paint.
  try {
    const p = JSON.parse(localStorage.getItem("kitsune.profile") || '"main"');
    const key = (k) => (p === "main" ? "kitsune." : `kitsune.${p}.`) + k;
    const get = (k) => { try { return JSON.parse(localStorage.getItem(key(k)) || "null"); } catch { return null; } };
    const [t] = get("theme") || [];
    if (t && t !== "system") document.documentElement.dataset.theme = t;
    // Custom theme and cursor, compiled earlier by themes.js
    const css = get("themeCss"), mode = get("themeMode"), cur = get("cursorCss");
    if (css) { document.documentElement.dataset.theme = mode || "dark"; document.write('<style id="kt-theme">' + css + "</style>"); }
    if (cur) document.write('<style id="kt-cursor">' + cur + "</style>");
  } catch {}
</script>
<script src="/js/main.js" type="module"></script>
