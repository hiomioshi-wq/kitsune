<!doctype html><html><head><meta charset="utf-8"><title>Form test</title></head><body>
<h1>A search box with no script behind it</h1>
<form action="https://www.google.com/search" method="get" role="search">
<label>Search <input type="search" name="q" placeholder="query"></label>
<select name="lang"><option value="en">English</option><option value="ja">日本語</option><option value="eo">Esperanto</option></select>
<label><input type="radio" name="safe" value="on" checked> Safe</label>
<label><input type="radio" name="safe" value="off"> Unfiltered</label>
<input type="hidden" name="kits" value="1">
<button type="submit">Go</button>
</form>
</body></html>
