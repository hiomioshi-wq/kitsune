<!doctype html><html><head><meta charset="utf-8"><title>Table test</title>
<style>td,th{padding:6px}</style></head><body>
<h1>Tables with structure</h1>
<table border="1">
<caption>Train times from Platform Zero</caption>
<thead><tr><th scope="col">Time</th><th scope="col">Destination</th><th scope="col">Fare</th></tr></thead>
<tbody>
<tr><th scope="row">02:00</th><td>Hollow Pine</td><td rowspan="2">One true story</td></tr>
<tr><th scope="row">02:15</th><td>The Reservoir</td></tr>
<tr><th scope="row">02:30</th><td colspan="2">The half-moon train (no tickets)</td></tr>
</tbody>
<tfoot><tr><td colspan="3">All times approximate; the station is fictional.</td></tr></tfoot>
</table>
</body></html>
